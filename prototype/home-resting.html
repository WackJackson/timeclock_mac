<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时薪观察 - 休息状态</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'td-brand': '#0052d9',
                        'td-brand-light': '#ecf2fe',
                        'td-success': '#00a870',
                        'td-warning': '#ed7b2f',
                        'td-error': '#e34d59',
                        'td-text': '#242424',
                        'td-text-secondary': '#666666',
                        'td-bg': '#f5f5f5',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        
        .rest-bg {
            background: linear-gradient(180deg, #a8edea 0%, #fed6e3 100%);
        }
        
        .float {
            animation: float 4s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        .cloud {
            animation: cloud-float 6s ease-in-out infinite;
        }
        
        @keyframes cloud-float {
            0%, 100% { transform: translateX(0px); }
            50% { transform: translateX(10px); }
        }
        
        .info-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.7);
        }
        
        .tab-active {
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="rest-bg min-h-screen overflow-hidden">
    <!-- 状态栏占位 -->
    <div class="h-12"></div>
    
    <!-- 装饰云朵 -->
    <div class="absolute top-20 left-4 opacity-50 cloud">
        <svg class="w-16 h-10" fill="white" viewBox="0 0 100 60">
            <ellipse cx="30" cy="40" rx="25" ry="20"/>
            <ellipse cx="55" cy="35" rx="30" ry="25"/>
            <ellipse cx="75" cy="45" rx="20" ry="15"/>
        </svg>
    </div>
    <div class="absolute top-32 right-8 opacity-40 cloud" style="animation-delay: -2s;">
        <svg class="w-12 h-8" fill="white" viewBox="0 0 100 60">
            <ellipse cx="30" cy="40" rx="25" ry="20"/>
            <ellipse cx="55" cy="35" rx="30" ry="25"/>
            <ellipse cx="75" cy="45" rx="20" ry="15"/>
        </svg>
    </div>
    
    <!-- 顶部状态指示 -->
    <div class="px-6 pt-2 relative z-10">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-3 h-3 bg-green-500 rounded-full"></div>
                <span class="text-sm font-medium text-gray-600">休息中</span>
            </div>
            <div class="text-sm text-gray-500">
                午休时间
            </div>
        </div>
    </div>
    
    <!-- 休息提示语 -->
    <div class="px-6 pt-10 text-center relative z-10">
        <div class="float mb-6">
            <span class="text-6xl">🌸</span>
        </div>
        <h2 class="text-2xl font-bold text-gray-700 mb-2">可以不用战斗了</h2>
        <p class="text-gray-500">请享受生活</p>
    </div>
    
    <!-- 今日金额展示 -->
    <div class="px-6 pt-8 pb-6 text-center relative z-10">
        <div class="info-card rounded-3xl p-6 inline-block">
            <p class="text-sm text-gray-500 mb-2">今日已赚</p>
            <div>
                <span class="text-4xl font-bold text-gray-700">¥325</span>
                <span class="text-2xl font-bold text-gray-700">.80</span>
            </div>
            <div class="flex items-center justify-center gap-4 mt-4 text-sm text-gray-500">
                <span class="flex items-center gap-1">
                    <span class="w-2 h-2 bg-blue-400 rounded-full"></span>
                    普通 3h
                </span>
                <span class="flex items-center gap-1">
                    <span class="w-2 h-2 bg-orange-400 rounded-full"></span>
                    燃尽 0h
                </span>
                <span class="flex items-center gap-1">
                    <span class="w-2 h-2 bg-cyan-400 rounded-full"></span>
                    摸鱼 0h
                </span>
            </div>
        </div>
    </div>
    
    <!-- 数据维度切换 -->
    <div class="px-6 mb-4 relative z-10">
        <div class="flex bg-white/50 rounded-xl p-1">
            <button class="flex-1 py-2 text-sm font-medium rounded-lg tab-active text-gray-700">日</button>
            <button class="flex-1 py-2 text-sm font-medium rounded-lg text-gray-500">周</button>
            <button class="flex-1 py-2 text-sm font-medium rounded-lg text-gray-500">月</button>
        </div>
    </div>
    
    <!-- 进度卡片 -->
    <div class="px-6 mb-4 relative z-10">
        <div class="info-card rounded-2xl p-4">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm text-gray-500">今日进度</span>
                <span class="text-sm font-bold text-gray-700">45.8%</span>
            </div>
            <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                <div class="h-full bg-gradient-to-r from-green-400 to-blue-400 rounded-full" style="width: 45.8%"></div>
            </div>
            <div class="flex justify-between text-xs text-gray-400 mt-2">
                <span>09:00</span>
                <span class="text-green-500 font-medium">← 当前：12:30 午休中</span>
                <span>18:00</span>
            </div>
        </div>
    </div>
    
    <!-- 下午安排提示 -->
    <div class="px-6 relative z-10">
        <div class="info-card rounded-2xl p-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-br from-blue-400 to-purple-500 rounded-xl flex items-center justify-center">
                    <span class="text-xl">⏰</span>
                </div>
                <div class="flex-1">
                    <p class="text-sm text-gray-500">下一个时段</p>
                    <p class="text-base font-bold text-gray-700">下午搬砖</p>
                    <p class="text-xs text-gray-400">14:00 - 18:00</p>
                </div>
                <div class="text-right">
                    <p class="text-lg font-bold text-gray-700">1:30</p>
                    <p class="text-xs text-gray-400">后开始</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 底部导航 -->
    <div class="absolute bottom-0 left-0 right-0">
        <div class="bg-white/70 backdrop-blur-xl border-t border-white/50">
            <div class="flex">
                <button class="flex-1 py-4 flex flex-col items-center gap-1 text-blue-500">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    <span class="text-xs font-medium">时薪</span>
                </button>
                <button class="flex-1 py-4 flex flex-col items-center gap-1 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="text-xs">攒钱</span>
                </button>
                <button class="flex-1 py-4 flex flex-col items-center gap-1 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span class="text-xs">我的</span>
                </button>
            </div>
        </div>
        <!-- Home Indicator -->
        <div class="h-8 bg-white/70 backdrop-blur-xl flex items-center justify-center">
            <div class="w-32 h-1 bg-gray-300 rounded-full"></div>
        </div>
    </div>
</body>
</html>
