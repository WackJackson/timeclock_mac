<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作时薪观察器 - 原型预览</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* TDesign 风格配色 */
        :root {
            --td-brand-color: #0052d9;
            --td-brand-color-light: #ecf2fe;
            --td-success-color: #00a870;
            --td-warning-color: #ed7b2f;
            --td-error-color: #e34d59;
            --td-text-primary: #242424;
            --td-text-secondary: #666666;
            --td-bg-color: #f5f5f5;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .phone-frame {
            width: 393px;
            height: 852px;
            background: #000;
            border-radius: 55px;
            padding: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }
        
        .phone-screen {
            width: 100%;
            height: 100%;
            border-radius: 45px;
            overflow: hidden;
            background: #fff;
        }
        
        .phone-notch {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 126px;
            height: 34px;
            background: #000;
            border-radius: 20px;
            z-index: 10;
        }
        
        .phone-label {
            text-align: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            margin-top: 16px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        .grid-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            justify-content: center;
            padding: 40px;
        }
        
        .phone-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            padding-top: 40px;
            text-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 1rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>💰 工作时薪观察器</h1>
    <p class="subtitle">微信小程序原型预览 · iPhone 15 Pro</p>
    
    <div class="grid-container">
        <!-- 引导设置页 -->
        <div class="phone-wrapper">
            <div class="phone-frame">
                <div class="phone-notch"></div>
                <div class="phone-screen">
                    <iframe src="setup.html"></iframe>
                </div>
            </div>
            <p class="phone-label">引导设置页</p>
        </div>
        
        <!-- 首页 - 工作状态 -->
        <div class="phone-wrapper">
            <div class="phone-frame">
                <div class="phone-notch"></div>
                <div class="phone-screen">
                    <iframe src="home-working.html"></iframe>
                </div>
            </div>
            <p class="phone-label">首页 - 工作状态</p>
        </div>
        
        <!-- 首页 - 休息状态 -->
        <div class="phone-wrapper">
            <div class="phone-frame">
                <div class="phone-notch"></div>
                <div class="phone-screen">
                    <iframe src="home-resting.html"></iframe>
                </div>
            </div>
            <p class="phone-label">首页 - 休息状态</p>
        </div>
        
        <!-- 攒钱观察 -->
        <div class="phone-wrapper">
            <div class="phone-frame">
                <div class="phone-notch"></div>
                <div class="phone-screen">
                    <iframe src="savings.html"></iframe>
                </div>
            </div>
            <p class="phone-label">攒钱观察</p>
        </div>
        
        <!-- 愿望详情 -->
        <div class="phone-wrapper">
            <div class="phone-frame">
                <div class="phone-notch"></div>
                <div class="phone-screen">
                    <iframe src="wish-detail.html"></iframe>
                </div>
            </div>
            <p class="phone-label">愿望详情</p>
        </div>
        
        <!-- 我的 -->
        <div class="phone-wrapper">
            <div class="phone-frame">
                <div class="phone-notch"></div>
                <div class="phone-screen">
                    <iframe src="profile.html"></iframe>
                </div>
            </div>
            <p class="phone-label">我的</p>
        </div>
    </div>
</body>
</html>
