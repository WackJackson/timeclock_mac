<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时薪观察 - 工作状态</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'td-brand': '#0052d9',
                        'td-brand-light': '#ecf2fe',
                        'td-success': '#00a870',
                        'td-warning': '#ed7b2f',
                        'td-error': '#e34d59',
                        'td-text': '#242424',
                        'td-text-secondary': '#666666',
                        'td-bg': '#f5f5f5',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        
        .battle-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f64f59 100%);
        }
        
        .pulse-ring {
            animation: pulse-ring 2s ease-out infinite;
        }
        
        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                opacity: 1;
            }
            100% {
                transform: scale(1.4);
                opacity: 0;
            }
        }
        
        .money-pulse {
            animation: money-pulse 1s ease-in-out infinite;
        }
        
        @keyframes money-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        
        .glow {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        
        .mode-btn.active {
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        
        .tab-active {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .countdown-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body class="battle-bg min-h-screen text-white overflow-hidden">
    <!-- 状态栏占位 -->
    <div class="h-12"></div>
    
    <!-- 顶部状态指示 -->
    <div class="px-6 pt-2">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="relative">
                    <div class="w-3 h-3 bg-green-400 rounded-full"></div>
                    <div class="absolute inset-0 w-3 h-3 bg-green-400 rounded-full pulse-ring"></div>
                </div>
                <span class="text-sm font-medium opacity-90">战斗状态</span>
            </div>
            <div class="text-sm opacity-80">
                下午搬砖中...
            </div>
        </div>
    </div>
    
    <!-- 核心金额展示 -->
    <div class="px-6 pt-8 pb-6 text-center">
        <p class="text-sm opacity-70 mb-2">今日已赚</p>
        <div class="money-pulse">
            <span class="text-6xl font-bold glow tracking-tight">¥486</span>
            <span class="text-3xl font-bold glow">.57</span>
        </div>
        <p class="text-sm opacity-70 mt-3">
            本月秒薪: ¥0.0217 / 秒
        </p>
    </div>
    
    <!-- 数据维度切换 -->
    <div class="px-6 mb-4">
        <div class="flex bg-white/10 rounded-xl p-1">
            <button class="flex-1 py-2 text-sm font-medium rounded-lg tab-active">日</button>
            <button class="flex-1 py-2 text-sm font-medium rounded-lg opacity-60">周</button>
            <button class="flex-1 py-2 text-sm font-medium rounded-lg opacity-60">月</button>
        </div>
    </div>
    
    <!-- 进度卡片 -->
    <div class="px-6 mb-4">
        <div class="countdown-card rounded-2xl p-4">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm opacity-80">今日进度</span>
                <span class="text-sm font-bold">68.5%</span>
            </div>
            <div class="h-2 bg-white/20 rounded-full overflow-hidden">
                <div class="h-full bg-white rounded-full" style="width: 68.5%"></div>
            </div>
            <div class="flex justify-between text-xs opacity-60 mt-2">
                <span>09:00</span>
                <span>18:00</span>
            </div>
        </div>
    </div>
    
    <!-- 模式切换按钮 -->
    <div class="px-6 mb-4">
        <p class="text-sm opacity-70 mb-3">当前模式</p>
        <div class="flex gap-3">
            <button class="mode-btn active flex-1 py-3 px-4 bg-white/20 rounded-xl border-2 border-white/40 flex flex-col items-center gap-1 transition-all">
                <span class="text-xl">⚡</span>
                <span class="text-xs font-medium">普通模式</span>
            </button>
            <button class="mode-btn flex-1 py-3 px-4 bg-white/10 rounded-xl border-2 border-transparent flex flex-col items-center gap-1 opacity-60 transition-all hover:opacity-100">
                <span class="text-xl">🔥</span>
                <span class="text-xs font-medium">燃尽模式</span>
            </button>
            <button class="mode-btn flex-1 py-3 px-4 bg-white/10 rounded-xl border-2 border-transparent flex flex-col items-center gap-1 opacity-60 transition-all hover:opacity-100">
                <span class="text-xl">🐟</span>
                <span class="text-xs font-medium">摸鱼模式</span>
            </button>
        </div>
    </div>
    
    <!-- 倒计时挂件 -->
    <div class="px-6">
        <p class="text-sm opacity-70 mb-3">倒计时</p>
        <div class="grid grid-cols-2 gap-3">
            <div class="countdown-card rounded-xl p-3">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-lg">☕</span>
                    <span class="text-xs opacity-70">距离休息</span>
                </div>
                <p class="text-lg font-bold">1小时23分</p>
            </div>
            <div class="countdown-card rounded-xl p-3">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-lg">🏠</span>
                    <span class="text-xs opacity-70">距离下班</span>
                </div>
                <p class="text-lg font-bold">2小时45分</p>
            </div>
            <div class="countdown-card rounded-xl p-3">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-lg">🎉</span>
                    <span class="text-xs opacity-70">距离周末</span>
                </div>
                <p class="text-lg font-bold">2天6小时</p>
            </div>
            <div class="countdown-card rounded-xl p-3">
                <div class="flex items-center gap-2 mb-1">
                    <span class="text-lg">🏖️</span>
                    <span class="text-xs opacity-70">距离假期</span>
                </div>
                <p class="text-lg font-bold">28天</p>
            </div>
        </div>
    </div>
    
    <!-- 底部导航 -->
    <div class="absolute bottom-0 left-0 right-0">
        <div class="bg-white/10 backdrop-blur-xl border-t border-white/10">
            <div class="flex">
                <button class="flex-1 py-4 flex flex-col items-center gap-1">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    <span class="text-xs font-medium">时薪</span>
                </button>
                <button class="flex-1 py-4 flex flex-col items-center gap-1 opacity-60">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="text-xs">攒钱</span>
                </button>
                <button class="flex-1 py-4 flex flex-col items-center gap-1 opacity-60">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span class="text-xs">我的</span>
                </button>
            </div>
        </div>
        <!-- Home Indicator -->
        <div class="h-8 bg-white/10 backdrop-blur-xl flex items-center justify-center">
            <div class="w-32 h-1 bg-white/50 rounded-full"></div>
        </div>
    </div>
</body>
</html>
