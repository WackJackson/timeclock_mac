<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'td-brand': '#0052d9',
                        'td-brand-light': '#ecf2fe',
                        'td-success': '#00a870',
                        'td-warning': '#ed7b2f',
                        'td-error': '#e34d59',
                        'td-text': '#242424',
                        'td-text-secondary': '#666666',
                        'td-bg': '#f5f5f5',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }
        
        .header-bg {
            background: linear-gradient(135deg, #0052d9 0%, #667eea 100%);
        }
        
        .stat-ring {
            animation: ring-in 1s ease-out forwards;
        }
        
        @keyframes ring-in {
            from { stroke-dashoffset: 283; }
        }
        
        .tab-active {
            color: #0052d9;
            border-bottom: 2px solid #0052d9;
        }
    </style>
</head>
<body class="bg-td-bg min-h-screen pb-24">
    <!-- 头部 -->
    <div class="header-bg pt-12 pb-8 px-6">
        <div class="flex items-center gap-4">
            <div class="w-16 h-16 bg-white rounded-full flex items-center justify-center text-3xl shadow-lg">
                😊
            </div>
            <div class="text-white">
                <h1 class="text-xl font-bold">打工人</h1>
                <p class="text-sm opacity-80 mt-1">工龄 1年3个月 · 已记录 286 天</p>
            </div>
        </div>
        
        <!-- 快捷统计 -->
        <div class="flex mt-6 gap-4">
            <div class="flex-1 bg-white/10 backdrop-blur rounded-xl p-3 text-center text-white">
                <p class="text-2xl font-bold">¥15,000</p>
                <p class="text-xs opacity-80 mt-1">当前月薪</p>
            </div>
            <div class="flex-1 bg-white/10 backdrop-blur rounded-xl p-3 text-center text-white">
                <p class="text-2xl font-bold">¥186.5k</p>
                <p class="text-xs opacity-80 mt-1">累计已赚</p>
            </div>
        </div>
    </div>
    
    <!-- 状态统计报表 -->
    <div class="px-6 -mt-4 relative z-10">
        <div class="bg-white rounded-2xl p-4 shadow-lg">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-bold text-td-text">工作状态统计</h2>
                <!-- 时间维度切换 -->
                <div class="flex text-sm">
                    <button class="px-3 py-1 tab-active font-medium">日</button>
                    <button class="px-3 py-1 text-td-text-secondary">周</button>
                    <button class="px-3 py-1 text-td-text-secondary">月</button>
                    <button class="px-3 py-1 text-td-text-secondary">年</button>
                </div>
            </div>
            
            <!-- 环形图 -->
            <div class="flex items-center justify-center gap-6">
                <div class="relative w-28 h-28">
                    <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                        <!-- 背景圆 -->
                        <circle cx="50" cy="50" r="40" fill="none" stroke="#f0f0f0" stroke-width="12"/>
                        <!-- 普通模式 - 蓝色 60% -->
                        <circle class="stat-ring" cx="50" cy="50" r="40" fill="none" stroke="#0052d9" stroke-width="12"
                            stroke-dasharray="251.3" stroke-dashoffset="100.5" stroke-linecap="round"/>
                        <!-- 燃尽模式 - 橙色 25% -->
                        <circle class="stat-ring" cx="50" cy="50" r="40" fill="none" stroke="#ed7b2f" stroke-width="12"
                            stroke-dasharray="251.3" stroke-dashoffset="188.5" stroke-linecap="round"
                            style="animation-delay: 0.2s; transform: rotate(216deg); transform-origin: center;"/>
                        <!-- 摸鱼模式 - 青色 15% -->
                        <circle class="stat-ring" cx="50" cy="50" r="40" fill="none" stroke="#00a870" stroke-width="12"
                            stroke-dasharray="251.3" stroke-dashoffset="213.6" stroke-linecap="round"
                            style="animation-delay: 0.4s; transform: rotate(306deg); transform-origin: center;"/>
                    </svg>
                    <div class="absolute inset-0 flex items-center justify-center">
                        <div class="text-center">
                            <p class="text-lg font-bold text-td-text">7h</p>
                            <p class="text-xs text-td-text-secondary">总时长</p>
                        </div>
                    </div>
                </div>
                
                <!-- 图例 -->
                <div class="space-y-3">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 bg-td-brand rounded-full"></span>
                        <div>
                            <p class="text-sm font-medium text-td-text">普通模式</p>
                            <p class="text-xs text-td-text-secondary">4.2h · 60% · ¥181.44</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 bg-td-warning rounded-full"></span>
                        <div>
                            <p class="text-sm font-medium text-td-text">燃尽模式</p>
                            <p class="text-xs text-td-text-secondary">1.75h · 25% · ¥75.60</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 bg-td-success rounded-full"></span>
                        <div>
                            <p class="text-sm font-medium text-td-text">摸鱼模式</p>
                            <p class="text-xs text-td-text-secondary">1.05h · 15% · ¥45.36</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 设置选项 -->
    <div class="px-6 mt-6">
        <h2 class="font-bold text-td-text mb-3">参数设置</h2>
        <div class="bg-white rounded-2xl overflow-hidden">
            <!-- 月薪设置 -->
            <button class="w-full p-4 flex items-center justify-between border-b border-gray-50 active:bg-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-50 rounded-xl flex items-center justify-center">
                        <span class="text-lg">💰</span>
                    </div>
                    <span class="font-medium text-td-text">月薪设置</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-td-text-secondary">¥15,000</span>
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
            </button>
            
            <!-- 工作日设置 -->
            <button class="w-full p-4 flex items-center justify-between border-b border-gray-50 active:bg-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-green-50 rounded-xl flex items-center justify-center">
                        <span class="text-lg">📅</span>
                    </div>
                    <span class="font-medium text-td-text">工作日设置</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-td-text-secondary">周一至周五</span>
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
            </button>
            
            <!-- 时段设置 -->
            <button class="w-full p-4 flex items-center justify-between active:bg-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-purple-50 rounded-xl flex items-center justify-center">
                        <span class="text-lg">⏰</span>
                    </div>
                    <span class="font-medium text-td-text">工作时段</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-td-text-secondary">09:00-18:00</span>
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
            </button>
        </div>
    </div>
    
    <!-- 其他设置 -->
    <div class="px-6 mt-6">
        <h2 class="font-bold text-td-text mb-3">其他</h2>
        <div class="bg-white rounded-2xl overflow-hidden">
            <button class="w-full p-4 flex items-center justify-between border-b border-gray-50 active:bg-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-orange-50 rounded-xl flex items-center justify-center">
                        <span class="text-lg">🔔</span>
                    </div>
                    <span class="font-medium text-td-text">提醒设置</span>
                </div>
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
            
            <button class="w-full p-4 flex items-center justify-between border-b border-gray-50 active:bg-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-cyan-50 rounded-xl flex items-center justify-center">
                        <span class="text-lg">📊</span>
                    </div>
                    <span class="font-medium text-td-text">数据导出</span>
                </div>
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
            
            <button class="w-full p-4 flex items-center justify-between border-b border-gray-50 active:bg-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gray-50 rounded-xl flex items-center justify-center">
                        <span class="text-lg">❓</span>
                    </div>
                    <span class="font-medium text-td-text">帮助与反馈</span>
                </div>
                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
            
            <button class="w-full p-4 flex items-center justify-between active:bg-gray-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-red-50 rounded-xl flex items-center justify-center">
                        <span class="text-lg">ℹ️</span>
                    </div>
                    <span class="font-medium text-td-text">关于</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-td-text-secondary">v1.0.0</span>
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                    </svg>
                </div>
            </button>
        </div>
    </div>
    
    <!-- 底部导航 -->
    <div class="fixed bottom-0 left-0 right-0">
        <div class="bg-white border-t border-gray-100">
            <div class="flex">
                <button class="flex-1 py-4 flex flex-col items-center gap-1 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                    </svg>
                    <span class="text-xs">时薪</span>
                </button>
                <button class="flex-1 py-4 flex flex-col items-center gap-1 text-gray-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span class="text-xs">攒钱</span>
                </button>
                <button class="flex-1 py-4 flex flex-col items-center gap-1 text-td-brand">
                    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    <span class="text-xs font-medium">我的</span>
                </button>
            </div>
        </div>
        <!-- Home Indicator -->
        <div class="h-8 bg-white flex items-center justify-center">
            <div class="w-32 h-1 bg-gray-200 rounded-full"></div>
        </div>
    </div>
</body>
</html>
